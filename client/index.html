<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Critter Siege</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230d243b'/%3E%3Cpath d='M12 40c8-14 32-14 40 0-6 10-34 10-40 0z' fill='%2334d399'/%3E%3Cpath d='M18 44c6 8 22 8 28 0-5 12-23 12-28 0z' fill='%23c47247'/%3E%3Ccircle cx='32' cy='24' r='9' fill='%234df4ff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --glass-bg: rgba(13, 24, 40, 0.68);
        --glass-border: rgba(255, 255, 255, 0.16);
        --glass-hi: rgba(255, 255, 255, 0.08);
        --text-main: #f4f8fc;
        --text-dim: #b4c6dc;
        --cyan: #4df4ff;
        --emerald: #34d399;
        --amber: #fbbf24;
        --coral: #fb7185;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b6db8;
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #hud-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      .cs-hidden {
        display: none !important;
      }

      .cs-glass {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 12px 32px rgba(5, 14, 28, 0.36);
      }

      /* ── Lobby Layer (floats cleanly over live 3D island) ─────────────── */
      .cs-lobby-layer {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        pointer-events: auto;
        background: radial-gradient(
          circle at center,
          rgba(10, 22, 38, 0.12) 0%,
          rgba(8, 17, 30, 0.56) 100%
        );
      }

      .cs-lobby-shell {
        width: min(940px, 100%);
        max-height: calc(100vh - 36px);
        overflow-y: auto;
        border-radius: 22px;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .cs-lobby-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .cs-kicker {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        color: var(--cyan);
        text-transform: uppercase;
      }

      .cs-title {
        margin: 2px 0 0;
        font-size: clamp(24px, 3.2vw, 34px);
        font-weight: 900;
        letter-spacing: -0.02em;
        background: linear-gradient(120deg, #ffffff 10%, #a5f3fc 65%, #fde68a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .cs-profile-strip {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .cs-essence-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(77, 244, 255, 0.14);
        border: 1px solid rgba(77, 244, 255, 0.36);
        color: #cffafe;
        font-size: 13px;
      }

      .cs-essence-pill strong {
        color: #ffffff;
        font-size: 15px;
      }

      .cs-input {
        background: rgba(8, 17, 30, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: #ffffff;
        padding: 8px 11px;
        font-size: 13px;
        font-weight: 600;
        outline: none;
      }

      .cs-input:focus {
        border-color: var(--cyan);
      }

      .cs-name-input {
        width: 145px;
      }

      .cs-code-input {
        width: 78px;
        text-align: center;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .cs-swatches {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .cs-swatch {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        cursor: pointer;
        padding: 0;
        transition: transform 0.12s ease;
      }

      .cs-swatch:hover {
        transform: scale(1.12);
      }

      .cs-swatch.cs-selected {
        border-color: #ffffff;
        box-shadow: 0 0 0 2px rgba(77, 244, 255, 0.75);
      }

      .cs-cta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .cs-join-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .cs-btn {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #ffffff;
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease, opacity 0.12s ease;
      }

      .cs-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }

      .cs-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .cs-btn-primary {
        background: linear-gradient(135deg, #10b981 0%, #0ea5e9 100%);
        border-color: rgba(167, 243, 208, 0.5);
        box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35);
      }

      .cs-btn-lg {
        padding: 11px 22px;
        font-size: 14px;
      }

      .cs-btn-secondary {
        background: rgba(255, 255, 255, 0.12);
      }

      .cs-btn-ghost {
        background: transparent;
        border-color: rgba(255, 255, 255, 0.18);
        color: var(--text-dim);
      }

      .cs-room-box {
        background: rgba(8, 17, 30, 0.54);
        border: 1px solid rgba(77, 244, 255, 0.28);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .cs-room-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .cs-room-code {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.18em;
        color: var(--cyan);
      }

      .cs-room-btns {
        display: flex;
        gap: 8px;
      }

      .cs-roster {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 8px;
      }

      .cs-roster-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 12px;
      }

      .cs-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .cs-roster-name {
        font-weight: 700;
      }

      .cs-roster-species {
        color: var(--text-dim);
        margin-left: auto;
      }

      .cs-team-chip {
        font-size: 10px;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(77, 244, 255, 0.18);
        color: var(--cyan);
      }

      .cs-wait-note {
        font-size: 12px;
        color: var(--text-dim);
        text-align: center;
      }

      .cs-config-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
      }

      .cs-config-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .cs-label-xs {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: var(--text-dim);
      }

      .cs-seg-row {
        display: inline-flex;
        gap: 5px;
      }

      .cs-seg-btn {
        background: rgba(8, 17, 30, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        color: var(--text-dim);
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .cs-seg-btn.cs-active {
        background: rgba(77, 244, 255, 0.2);
        border-color: var(--cyan);
        color: #ffffff;
      }

      .cs-seg-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .cs-lobby-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cs-section-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }

      .cs-section-head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .cs-muted-note {
        font-size: 12px;
        color: var(--text-dim);
      }

      .cs-species-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 9px;
      }

      .cs-species-card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 13px;
        padding: 10px 11px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        transition: border-color 0.12s ease, background 0.12s ease, transform 0.12s ease;
      }

      .cs-species-card:hover:not(.cs-locked) {
        background: rgba(255, 255, 255, 0.11);
        transform: translateY(-1px);
      }

      .cs-species-card.cs-selected {
        border-color: var(--cyan);
        background: rgba(77, 244, 255, 0.15);
        box-shadow: 0 0 0 1px rgba(77, 244, 255, 0.45);
      }

      .cs-species-card.cs-locked {
        cursor: default;
        opacity: 0.86;
      }

      .cs-species-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
        font-size: 12.5px;
      }

      .cs-stat-pill {
        font-size: 10px;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.2);
        color: #a7f3d0;
      }

      .cs-species-trait {
        margin: 0;
        font-size: 11px;
        line-height: 1.3;
        color: var(--text-dim);
        flex: 1;
      }

      .cs-species-status {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--cyan);
      }

      .cs-unlock-btn {
        border: 1px solid rgba(251, 191, 36, 0.6);
        background: rgba(251, 191, 36, 0.2);
        color: #fef3c7;
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
      }

      .cs-unlock-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      .cs-unlock-sm {
        padding: 3px 7px;
        font-size: 10px;
      }

      .cs-bonus-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 9px;
      }

      .cs-bonus-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 12px;
        padding: 9px 11px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .cs-bonus-card.cs-selected {
        border-color: var(--emerald);
        background: rgba(52, 211, 153, 0.15);
      }

      .cs-bonus-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12.5px;
      }

      .cs-bonus-card p {
        margin: 0;
        font-size: 11px;
        color: var(--text-dim);
        line-height: 1.3;
      }

      .cs-tag {
        font-size: 10px;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.24);
        color: #a7f3d0;
      }

      /* ── In-Game HUD ───────────────────────────────────────────────────── */
      .cs-game-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .cs-top-bar {
        position: absolute;
        top: 14px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .cs-turn-pill {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
      }

      .cs-round-badge {
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        font-size: 11px;
        font-weight: 800;
      }

      .cs-phase-badge {
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.05em;
        background: rgba(255, 255, 255, 0.14);
      }

      .cs-phase-badge[data-tone="mine"] {
        background: rgba(52, 211, 153, 0.28);
        color: #a7f3d0;
      }

      .cs-phase-badge[data-tone="retreat"] {
        background: rgba(251, 191, 36, 0.3);
        color: #fef3c7;
      }

      .cs-timer-readout {
        font-size: 18px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        min-width: 34px;
        text-align: center;
      }

      .cs-timer-urgent {
        color: var(--coral);
      }

      .cs-divider {
        width: 1px;
        height: 16px;
        background: rgba(255, 255, 255, 0.2);
      }

      .cs-active-player {
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cs-wind-widget {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--cyan);
      }

      .cs-wind-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s ease;
      }

      .cs-wind-speed {
        font-size: 12px;
        color: var(--text-main);
        font-variant-numeric: tabular-nums;
      }

      .cs-top-actions {
        position: absolute;
        right: 0;
        display: inline-flex;
        gap: 8px;
        pointer-events: auto;
      }

      .cs-icon-btn {
        border-radius: 10px;
        padding: 7px 11px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .cs-icon-btn:hover {
        border-color: var(--cyan);
      }

      .cs-charge-wrap {
        position: absolute;
        bottom: 112px;
        left: 50%;
        transform: translateX(-50%);
      }

      .cs-charge-box {
        width: 220px;
        padding: 8px 12px;
        border-radius: 12px;
      }

      .cs-charge-header {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--cyan);
        margin-bottom: 5px;
      }

      .cs-charge-track {
        height: 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }

      .cs-charge-fill {
        height: 100%;
        width: 15%;
        background: linear-gradient(90deg, #38bdf8 0%, #fbbf24 70%, #f43f5e 100%);
        border-radius: 999px;
      }

      /* Bottom-Left Status Panel */
      .cs-bottom-left {
        position: absolute;
        bottom: 16px;
        left: 16px;
        width: min(310px, calc(100vw - 32px));
        border-radius: 16px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cs-bl-head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 800;
      }

      .cs-bl-team {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.25);
        color: #bae6fd;
      }

      .cs-bl-shield {
        margin-left: auto;
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(77, 244, 255, 0.25);
        color: var(--cyan);
      }

      .cs-bar-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .cs-hp-track {
        flex: 1;
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      .cs-hp-fill {
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: var(--emerald);
        transition: width 0.2s ease;
      }

      .cs-hp-fill[data-tier="mid"] {
        background: var(--amber);
      }

      .cs-hp-fill[data-tier="low"] {
        background: var(--coral);
      }

      .cs-hp-text {
        font-size: 12px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        min-width: 62px;
        text-align: right;
      }

      .cs-evo-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .cs-evo-label {
        font-size: 10px;
        font-weight: 900;
        color: var(--cyan);
        letter-spacing: 0.08em;
      }

      .cs-evo-track {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      .cs-evo-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #38bdf8, #4df4ff);
        transition: width 0.25s ease;
      }

      .cs-evo-text {
        font-size: 11px;
        font-weight: 800;
        color: #cffafe;
        min-width: 44px;
        text-align: right;
      }

      .cs-hardpoints {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
      }

      .cs-hp-pill {
        display: flex;
        flex-direction: column;
        padding: 4px 7px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .cs-hp-pill.cs-hp-filled {
        border-color: rgba(77, 244, 255, 0.42);
        background: rgba(77, 244, 255, 0.12);
      }

      .cs-hp-slot {
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.08em;
        color: var(--text-dim);
      }

      .cs-hp-val {
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cs-apex-badge {
        text-align: center;
        padding: 5px 8px;
        border-radius: 9px;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        background: linear-gradient(
          90deg,
          rgba(251, 191, 36, 0.28),
          rgba(77, 244, 255, 0.28)
        );
        border: 1px solid rgba(253, 224, 71, 0.55);
        color: #fef9c3;
      }

      /* Bottom-Right Gadget Hotbar */
      .cs-bottom-right {
        position: absolute;
        bottom: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 7px;
        max-width: calc(100vw - 350px);
      }

      .cs-hotbar-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        pointer-events: auto;
      }

      .cs-hotbar-slot {
        position: relative;
        min-width: 82px;
        padding: 7px 9px;
        border-radius: 12px;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        cursor: pointer;
        transition: transform 0.1s ease, border-color 0.12s ease;
      }

      .cs-hotbar-slot:hover:not(:disabled) {
        transform: translateY(-2px);
      }

      .cs-hotbar-slot.cs-slot-active {
        border-color: var(--cyan);
        background: rgba(14, 116, 144, 0.72);
        box-shadow: 0 0 18px rgba(77, 244, 255, 0.35);
      }

      .cs-hotbar-slot.cs-slot-empty {
        opacity: 0.42;
        cursor: not-allowed;
      }

      .cs-slot-key {
        font-size: 10px;
        font-weight: 900;
        color: var(--cyan);
      }

      .cs-slot-name {
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }

      .cs-slot-charges {
        position: absolute;
        top: 6px;
        right: 8px;
        font-size: 10px;
        font-weight: 800;
        color: #fde68a;
      }

      .cs-controls-strip {
        padding: 5px 11px;
        border-radius: 999px;
        font-size: 11px;
        color: var(--text-dim);
        white-space: nowrap;
      }

      /* ── First-Person Optic Visor Overlay ─────────────────────────────── */
      .cs-visor-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 80px rgba(34, 211, 238, 0.22);
      }

      .cs-visor-corner {
        position: absolute;
        width: 44px;
        height: 44px;
        border-color: rgba(77, 244, 255, 0.75);
        border-style: solid;
      }

      .cs-vc-tl {
        top: 22px;
        left: 22px;
        border-width: 3px 0 0 3px;
        border-radius: 10px 0 0 0;
      }

      .cs-vc-tr {
        top: 22px;
        right: 22px;
        border-width: 3px 3px 0 0;
        border-radius: 0 10px 0 0;
      }

      .cs-vc-bl {
        bottom: 22px;
        left: 22px;
        border-width: 0 0 3px 3px;
        border-radius: 0 0 0 10px;
      }

      .cs-vc-br {
        bottom: 22px;
        right: 22px;
        border-width: 0 3px 3px 0;
        border-radius: 0 0 10px 0;
      }

      .cs-visor-tag {
        position: absolute;
        top: 72px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.18em;
        color: var(--cyan);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
      }

      .cs-visor-reticle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cs-visor-pct {
        position: absolute;
        left: -26px;
        font-size: 12px;
        font-weight: 900;
        color: var(--cyan);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
      }

      /* ── Tactical Drone Recon Overlay ─────────────────────────────────── */
      .cs-drone-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .cs-drone-bracket {
        position: absolute;
        width: 34px;
        height: 34px;
        border-color: rgba(255, 255, 255, 0.6);
        border-style: solid;
      }

      .cs-db-tl {
        top: 18px;
        left: 18px;
        border-width: 2px 0 0 2px;
      }

      .cs-db-tr {
        top: 18px;
        right: 18px;
        border-width: 2px 2px 0 0;
      }

      .cs-db-bl {
        bottom: 18px;
        left: 18px;
        border-width: 0 0 2px 2px;
      }

      .cs-db-br {
        bottom: 18px;
        right: 18px;
        border-width: 0 2px 2px 0;
      }

      .cs-drone-badge {
        position: absolute;
        top: 66px;
        left: 24px;
        padding: 7px 12px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.09em;
        color: var(--cyan);
      }

      .cs-drone-compass {
        position: absolute;
        top: 66px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      /* ── Modals (Mutation Draft & Match Over) ─────────────────────────── */
      .cs-modal-backdrop {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(6, 14, 26, 0.56);
        pointer-events: auto;
      }

      .cs-modal-card {
        width: min(740px, 100%);
        border-radius: 22px;
        padding: 22px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .cs-modal-sm {
        width: min(440px, 100%);
        text-align: center;
      }

      .cs-modal-card h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 900;
      }

      .cs-draft-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
      }

      .cs-draft-card {
        text-align: left;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 14px;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 8px;
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      }

      .cs-draft-card:hover {
        transform: translateY(-3px);
        border-color: var(--cyan);
        background: rgba(77, 244, 255, 0.15);
      }

      .cs-draft-slot {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.1em;
        color: var(--cyan);
      }

      .cs-draft-card h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 800;
      }

      .cs-draft-card p {
        margin: 0;
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.4;
        flex: 1;
      }

      .cs-swap-warning {
        font-size: 11px;
        font-weight: 800;
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(251, 191, 36, 0.2);
        color: #fde68a;
      }

      .cs-new-slot {
        font-size: 11px;
        font-weight: 700;
        color: #a7f3d0;
      }

      .cs-draft-footer {
        display: flex;
        justify-content: center;
        padding-top: 4px;
      }

      .cs-winner-title {
        font-size: 28px !important;
        color: #fef08a;
      }

      .cs-scoreboard {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .cs-scoreboard th,
      .cs-scoreboard td {
        padding: 8px 10px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .cs-scoreboard th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
      }

      .cs-scoreboard td .cs-dot {
        margin-right: 7px;
      }

      .cs-row-local {
        background: rgba(77, 244, 255, 0.1);
      }

      .cs-essence-summary {
        background: rgba(8, 17, 30, 0.56);
        border: 1px solid rgba(77, 244, 255, 0.3);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cs-essence-title {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.12em;
        color: var(--cyan);
      }

      .cs-essence-rows {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        font-size: 13px;
      }

      .cs-essence-total {
        display: flex;
        justify-content: space-between;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 14px;
        color: #fef08a;
      }

      .cs-modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      /* ── Toast Banner ─────────────────────────────────────────────────── */
      .cs-toast {
        position: fixed;
        top: 72px;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        background: rgba(13, 24, 40, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.24);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
        z-index: 40;
      }

      .cs-toast-success {
        border-color: rgba(52, 211, 153, 0.7);
        color: #a7f3d0;
      }

      .cs-toast-error {
        border-color: rgba(251, 113, 133, 0.8);
        color: #fecdd3;
      }

      @media (max-width: 820px) {
        .cs-controls-strip {
          display: none;
        }
        .cs-bottom-right {
          max-width: calc(100vw - 32px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Critter Siege</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230d243b'/%3E%3Cpath d='M12 40c8-14 32-14 40 0-6 10-34 10-40 0z' fill='%2334d399'/%3E%3Cpath d='M18 44c6 8 22 8 28 0-5 12-23 12-28 0z' fill='%23c47247'/%3E%3Ccircle cx='32' cy='24' r='9' fill='%234df4ff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --glass-bg: rgba(11, 22, 38, 0.56);
        --glass-bg-strong: rgba(10, 20, 36, 0.76);
        --glass-border: rgba(255, 255, 255, 0.16);
        --text-main: #f5f9ff;
        --text-dim: #aec3dc;
        --cyan: #4df4ff;
        --emerald: #34d399;
        --amber: #fbbf24;
        --coral: #fb7185;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b6db8;
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #hud-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      .cs-hidden {
        display: none !important;
      }

      .cs-glass {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(16px) saturate(1.25);
        -webkit-backdrop-filter: blur(16px) saturate(1.25);
        box-shadow: 0 12px 34px rgba(5, 14, 28, 0.34);
      }

      kbd {
        font-family: inherit;
        font-size: 10px;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #ffffff;
        letter-spacing: 0.03em;
      }

      /* ── Lobby Layer: Breathing Full-Screen 3D Stage + Floating Left Glass Dock ── */
      .cs-lobby-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 22px;
      }

      .cs-dock-wrap {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-height: calc(100vh - 44px);
      }

      .cs-left-dock {
        pointer-events: auto;
        width: min(344px, calc(100vw - 44px));
        max-height: calc(100vh - 44px);
        overflow-y: auto;
        border-radius: 24px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 13px;
        background: rgba(10, 21, 36, 0.62);
      }

      .cs-dock-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .cs-brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .cs-brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .cs-title {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.02em;
        background: linear-gradient(120deg, #ffffff 15%, #a5f3fc 70%, #fde68a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .cs-essence-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: 999px;
        background: rgba(77, 244, 255, 0.14);
        border: 1px solid rgba(77, 244, 255, 0.34);
        color: #cffafe;
        font-size: 13px;
        font-weight: 800;
      }

      .cs-essence-pill strong {
        color: #ffffff;
      }

      .cs-primary-actions {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 8px;
      }

      .cs-btn {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 13px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.01em;
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: transform 0.12s ease, filter 0.12s ease, background 0.12s ease;
      }

      .cs-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }

      .cs-btn:disabled {
        opacity: 0.44;
        cursor: not-allowed;
      }

      .cs-btn-primary {
        background: linear-gradient(135deg, #10b981 0%, #0ea5e9 100%);
        border-color: rgba(167, 243, 208, 0.55);
        box-shadow: 0 8px 22px rgba(14, 165, 233, 0.36);
      }

      .cs-play-cta {
        font-size: 14px;
        padding: 11px 16px;
      }

      .cs-btn-secondary {
        background: rgba(255, 255, 255, 0.11);
      }

      .cs-btn-open {
        border-color: var(--cyan);
        background: rgba(77, 244, 255, 0.18);
      }

      .cs-btn-full {
        width: 100%;
      }

      .cs-mp-drawer {
        background: rgba(6, 15, 28, 0.54);
        border: 1px solid rgba(77, 244, 255, 0.24);
        border-radius: 15px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cs-join-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
      }

      .cs-input {
        background: rgba(8, 17, 30, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        color: #ffffff;
        padding: 7px 10px;
        font-size: 12.5px;
        font-weight: 700;
        outline: none;
      }

      .cs-input:focus {
        border-color: var(--cyan);
      }

      .cs-code-input {
        text-align: center;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .cs-room-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .cs-room-code {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.18em;
        color: var(--cyan);
      }

      .cs-room-actions {
        display: flex;
        gap: 5px;
      }

      .cs-mini-pill-btn {
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border-radius: 8px;
        padding: 4px 9px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }

      .cs-danger-pill:hover {
        border-color: rgba(251, 113, 133, 0.7);
        color: #fecdd3;
      }

      .cs-roster {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .cs-roster-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 8px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 12px;
      }

      .cs-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .cs-roster-name {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cs-roster-species {
        color: var(--text-dim);
        margin-left: auto;
        font-size: 11px;
      }

      .cs-team-chip {
        font-size: 10px;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(77, 244, 255, 0.18);
        color: var(--cyan);
      }

      .cs-wait-note {
        font-size: 12px;
        color: var(--text-dim);
        text-align: center;
        padding: 4px 0;
      }

      /* Visual Species Tiles (3x2 compact grid, 1-word trait icon chips) */
      .cs-species-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .cs-sp-tile {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 9px 6px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      }

      .cs-sp-tile:hover:not(.cs-locked) {
        background: rgba(255, 255, 255, 0.12);
        transform: translateY(-2px);
      }

      .cs-sp-tile.cs-selected {
        border-color: var(--sp-accent, var(--cyan));
        background: rgba(77, 244, 255, 0.14);
        box-shadow: 0 0 0 1px var(--sp-accent, var(--cyan)),
          0 6px 16px rgba(0, 0, 0, 0.22);
      }

      .cs-sp-tile.cs-locked {
        opacity: 0.76;
        cursor: default;
      }

      .cs-sp-icon {
        color: var(--sp-accent, var(--cyan));
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .cs-sp-name {
        font-size: 11.5px;
        font-weight: 800;
        color: #ffffff;
      }

      .cs-sp-chip {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        color: var(--text-dim);
        white-space: nowrap;
      }

      .cs-sp-unlock {
        border: 1px solid rgba(251, 191, 36, 0.55);
        background: rgba(251, 191, 36, 0.2);
        color: #fef3c7;
        border-radius: 999px;
        padding: 2px 7px;
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
      }

      .cs-sp-unlock:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      /* Compact Match Settings */
      .cs-settings-compact {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 9px 10px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
      }

      .cs-setting-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .cs-setting-split {
        gap: 8px;
      }

      .cs-set-label {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      .cs-chip-group {
        display: inline-flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px;
      }

      .cs-chip-btn {
        background: rgba(7, 15, 27, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 8px;
        color: var(--text-dim);
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: border-color 0.12s ease, background 0.12s ease;
      }

      .cs-chip-btn.cs-active {
        background: rgba(77, 244, 255, 0.2);
        border-color: var(--cyan);
        color: #ffffff;
      }

      .cs-chip-btn:disabled {
        opacity: 0.46;
        cursor: not-allowed;
      }

      /* Dock Footer: Name + Swatches + Slide-out Shop */
      .cs-dock-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .cs-id-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }

      .cs-name-input {
        width: 96px;
        padding: 6px 8px;
        font-size: 12px;
      }

      .cs-swatches {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .cs-swatch {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        cursor: pointer;
        padding: 0;
        transition: transform 0.12s ease;
      }

      .cs-swatch:hover {
        transform: scale(1.16);
      }

      .cs-swatch.cs-selected {
        border-color: #ffffff;
        box-shadow: 0 0 0 2px rgba(77, 244, 255, 0.78);
      }

      .cs-shop-toggle {
        position: relative;
        border: 1px solid rgba(77, 244, 255, 0.36);
        background: rgba(77, 244, 255, 0.14);
        color: #e0f2fe;
        border-radius: 10px;
        padding: 6px 11px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
      }

      .cs-shop-toggle.cs-active {
        background: rgba(77, 244, 255, 0.28);
        border-color: var(--cyan);
        color: #ffffff;
      }

      .cs-notif-dot {
        position: absolute;
        top: -3px;
        right: -3px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 8px var(--amber);
      }

      /* Slide-Out Shop Drawer */
      .cs-shop-drawer {
        pointer-events: auto;
        width: 268px;
        border-radius: 20px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: rgba(10, 21, 36, 0.72);
        animation: csSlideIn 0.18s ease-out;
      }

      @keyframes csSlideIn {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .cs-shop-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 900;
        color: var(--cyan);
      }

      .cs-close-btn {
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }

      .cs-shop-sub {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-dim);
      }

      .cs-shop-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .cs-shop-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        cursor: pointer;
      }

      .cs-shop-item.cs-selected {
        border-color: var(--emerald);
        background: rgba(52, 211, 153, 0.16);
      }

      .cs-shop-icon {
        color: var(--cyan);
        flex-shrink: 0;
        display: inline-flex;
      }

      .cs-shop-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
        flex: 1;
        min-width: 0;
      }

      .cs-shop-info strong {
        font-size: 12px;
      }

      .cs-shop-info span {
        font-size: 10.5px;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cs-shop-tag {
        font-size: 10px;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.24);
        color: #a7f3d0;
      }

      /* Floating Bottom-Right Hero Stage Badge in Lobby */
      .cs-hero-stage-badge {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 10px 16px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        pointer-events: none;
      }

      .cs-hero-stage-name {
        font-size: 15px;
        font-weight: 900;
        letter-spacing: -0.01em;
      }

      .cs-hero-stage-chip {
        font-size: 11px;
        font-weight: 700;
        color: var(--cyan);
      }

      /* ── In-Game HUD (Ultra-Clean & Minimal) ──────────────────────────── */
      .cs-game-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .cs-top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }

      .cs-top-center-stack {
        position: static;
        transform: none;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        min-width: 0;
      }

      .cs-turn-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        max-width: 100%;
      }

      .cs-round-badge {
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        font-size: 10.5px;
        font-weight: 800;
      }

      .cs-phase-badge {
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 900;
        letter-spacing: 0.05em;
        background: rgba(255, 255, 255, 0.14);
      }

      .cs-phase-badge[data-tone="mine"] {
        background: rgba(52, 211, 153, 0.28);
        color: #a7f3d0;
      }

      .cs-phase-badge[data-tone="retreat"] {
        background: rgba(251, 191, 36, 0.34);
        color: #fef3c7;
      }

      .cs-timer-readout {
        font-size: 17px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        min-width: 30px;
        text-align: center;
      }

      .cs-timer-warn {
        color: var(--amber);
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.55);
        animation: csTimerWarnPulse 1s ease-in-out infinite;
      }

      .cs-timer-urgent {
        color: var(--coral);
        text-shadow: 0 0 12px rgba(251, 113, 133, 0.72);
        animation: csPulseUrgent 0.65s ease-in-out infinite;
      }

      @keyframes csTimerWarnPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }

      .cs-divider {
        width: 1px;
        height: 14px;
        background: rgba(255, 255, 255, 0.18);
      }

      .cs-active-player {
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cs-wind-widget {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--cyan);
      }

      .cs-wind-arrow {
        display: inline-flex;
        transition: transform 0.25s ease;
      }

      .cs-wind-speed {
        font-size: 12px;
        color: var(--text-main);
        font-variant-numeric: tabular-nums;
      }

      /* Top Compass Rival & Evo Pod Directional Strip */
      .cs-compass-strip {
        position: relative;
        width: 248px;
        height: 22px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(9, 19, 34, 0.44);
      }

      .cs-compass-pip {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 10.5px;
        font-weight: 900;
        letter-spacing: 0.02em;
        white-space: nowrap;
        padding: 1px 6px;
        border-radius: 999px;
        transition: left 0.08s linear;
      }

      .cs-compass-rival {
        color: var(--pip-color, #fb7185);
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.8);
      }

      .cs-compass-pod {
        color: #4df4ff;
        text-shadow: 0 0 8px rgba(77, 244, 255, 0.7);
      }

      /* Top-Right Always-Visible Clickable Camera Switcher Pills + Mini Utility Buttons */
      .cs-top-right-controls {
        position: static;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        pointer-events: auto;
      }

      .cs-cam-switcher {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 4px;
        border-radius: 999px;
      }

      .cs-cam-pill {
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-dim);
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 11.5px;
        font-weight: 800;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
        transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
      }

      .cs-cam-pill:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.09);
      }

      .cs-cam-pill.cs-cam-active {
        background: rgba(77, 244, 255, 0.24);
        border-color: rgba(77, 244, 255, 0.72);
        color: #ffffff;
        box-shadow: 0 0 14px rgba(77, 244, 255, 0.28);
      }

      .cs-cam-pill kbd {
        font-size: 9px;
        padding: 1px 4px;
        opacity: 0.8;
      }

      .cs-mini-icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: border-color 0.12s ease, transform 0.12s ease;
      }

      .cs-mini-icon-btn:hover {
        border-color: var(--cyan);
        transform: translateY(-1px);
      }

      .cs-mini-icon-btn[data-muted="1"] {
        color: var(--coral);
      }

      /* Brief Animated Center Turn Banner (1.6s auto-fade) */
      .cs-turn-banner {
        position: fixed;
        top: 22%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        padding: 12px 28px;
        border-radius: 20px;
        background: rgba(8, 18, 34, 0.72);
        border: 1.5px solid rgba(77, 244, 255, 0.55);
        backdrop-filter: blur(14px);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.42);
        z-index: 25;
      }

      .cs-turn-banner[data-tone="mine"] {
        border-color: rgba(52, 211, 153, 0.75);
      }

      .cs-turn-banner[data-tone="retreat"] {
        border-color: rgba(251, 191, 36, 0.85);
        box-shadow: 0 0 32px rgba(251, 191, 36, 0.28);
      }

      .cs-turn-banner[data-tone="pod"] {
        border-color: rgba(77, 244, 255, 0.9);
        box-shadow: 0 0 32px rgba(77, 244, 255, 0.34);
      }

      .cs-banner-title {
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 900;
        letter-spacing: 0.06em;
        color: #ffffff;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
      }

      .cs-turn-banner[data-tone="retreat"] .cs-banner-title {
        color: #fde68a;
      }

      .cs-turn-banner[data-tone="pod"] .cs-banner-title {
        color: #a5f3fc;
      }

      .cs-banner-sub {
        margin-top: 3px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text-dim);
        letter-spacing: 0.03em;
      }

      .cs-banner-anim {
        animation: csBannerPop 1.62s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes csBannerPop {
        0% {
          opacity: 0;
          transform: translate(-50%, -40%) scale(0.86);
        }
        14% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.03);
        }
        24% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        78% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -62%) scale(0.95);
        }
      }

      /* Live Center Glowing Charge Power Arc (EVERY Camera Mode!) */
      .cs-center-charge {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 0 12px rgba(77, 244, 255, 0.45));
        z-index: 22;
      }

      .cs-center-charge-pct {
        position: absolute;
        bottom: 6px;
        font-size: 14px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      }

      /* Minimal Bottom-Left Status Cluster */
      .cs-bottom-left {
        position: absolute;
        bottom: 18px;
        left: 18px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .cs-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 14px 7px 9px;
        border-radius: 999px;
      }

      .cs-evo-ring {
        position: relative;
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .cs-evo-ring-text {
        position: absolute;
        font-size: 9.5px;
        font-weight: 900;
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
      }

      .cs-hp-cluster {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 112px;
      }

      .cs-hp-num-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .cs-hp-big {
        font-size: 18px;
        font-weight: 900;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .cs-bl-team {
        font-size: 9.5px;
        font-weight: 900;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.25);
        color: #bae6fd;
      }

      .cs-bl-shield {
        font-size: 12px;
      }

      .cs-hp-track {
        width: 116px;
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }

      .cs-hp-fill {
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: var(--emerald);
        transition: width 0.2s ease;
      }

      .cs-hp-fill[data-tier="mid"] {
        background: var(--amber);
      }

      .cs-hp-fill[data-tier="low"] {
        background: var(--coral);
      }

      .cs-move-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
        width: 116px;
      }

      .cs-move-label {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: rgba(224, 242, 254, 0.78);
        line-height: 1;
        flex: 0 0 auto;
      }

      .cs-move-track {
        flex: 1 1 auto;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      .cs-move-fill {
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #38bdf8, #34d399);
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.45);
        transition: width 0.08s linear, background 0.18s ease;
      }

      .cs-move-fill[data-tier="low"] {
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        box-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
      }

      .cs-move-fill[data-tier="empty"] {
        background: rgba(248, 113, 113, 0.65);
        box-shadow: none;
      }

      .cs-hardpoints-row {
        display: inline-flex;
        gap: 6px;
        pointer-events: auto;
      }

      .cs-hp-icon-slot {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.28);
        transition: border-color 0.14s ease, color 0.14s ease;
      }

      .cs-hp-icon-slot.cs-hp-filled {
        color: var(--cyan);
        border-color: rgba(77, 244, 255, 0.62);
        background: rgba(14, 116, 144, 0.48);
        box-shadow: 0 0 12px rgba(77, 244, 255, 0.26);
      }

      .cs-apex-badge {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 900;
        letter-spacing: 0.08em;
        background: linear-gradient(
          90deg,
          rgba(251, 191, 36, 0.3),
          rgba(77, 244, 255, 0.3)
        );
        border: 1px solid rgba(253, 224, 71, 0.6);
        color: #fef9c3;
      }

      /* Bottom-Center Icon-First Gadget Dock + Turn-1 Quick-Start Pill */
      .cs-bottom-center {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .cs-quickstart-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 700;
        color: #e2f1ff;
        white-space: nowrap;
      }

      .cs-qs-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(77, 244, 255, 0.65);
      }

      .cs-gadget-dock {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border-radius: 18px;
        pointer-events: auto;
      }

      .cs-dock-slot {
        position: relative;
        width: 50px;
        height: 50px;
        border-radius: 13px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: #e2eefb;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      }

      .cs-dock-slot:hover:not(:disabled) {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.42);
        background: rgba(255, 255, 255, 0.14);
      }

      .cs-dock-slot.cs-slot-active {
        border-color: var(--cyan);
        background: rgba(14, 116, 144, 0.72);
        color: #ffffff;
        box-shadow: 0 0 18px rgba(77, 244, 255, 0.4);
      }

      .cs-dock-slot.cs-slot-empty {
        opacity: 0.36;
        cursor: not-allowed;
      }

      .cs-dock-slot::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%) translateY(4px);
        padding: 5px 10px;
        border-radius: 9px;
        background: rgba(9, 19, 34, 0.92);
        border: 1px solid rgba(77, 244, 255, 0.36);
        color: #f8fafc;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.14s ease, transform 0.14s ease;
      }

      .cs-dock-slot:hover::after {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .cs-slot-key {
        position: absolute;
        top: 4px;
        left: 6px;
        font-size: 9.5px;
        font-weight: 900;
        color: var(--cyan);
      }

      .cs-slot-svg {
        display: inline-flex;
      }

      .cs-slot-charges {
        position: absolute;
        bottom: 3px;
        right: 5px;
        font-size: 9.5px;
        font-weight: 900;
        color: #fde68a;
      }

      .cs-slot-ping {
        color: var(--cyan);
        font-size: 8.5px;
      }

      /* ── First-Person Optic Visor Overlay ─────────────────────────────── */
      .cs-visor-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 70px rgba(34, 211, 238, 0.2);
      }

      .cs-visor-corner {
        position: absolute;
        width: 38px;
        height: 38px;
        border-color: rgba(77, 244, 255, 0.72);
        border-style: solid;
      }

      .cs-vc-tl {
        top: 20px;
        left: 20px;
        border-width: 2.5px 0 0 2.5px;
        border-radius: 9px 0 0 0;
      }

      .cs-vc-tr {
        top: 20px;
        right: 20px;
        border-width: 2.5px 2.5px 0 0;
        border-radius: 0 9px 0 0;
      }

      .cs-vc-bl {
        bottom: 20px;
        left: 20px;
        border-width: 0 0 2.5px 2.5px;
        border-radius: 0 0 0 9px;
      }

      .cs-vc-br {
        bottom: 20px;
        right: 20px;
        border-width: 0 2.5px 2.5px 0;
        border-radius: 0 0 9px 0;
      }

      .cs-visor-reticle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      /* ── Tactical Drone Recon Overlay ─────────────────────────────────── */
      .cs-drone-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .cs-drone-bracket {
        position: absolute;
        width: 30px;
        height: 30px;
        border-color: rgba(255, 255, 255, 0.55);
        border-style: solid;
      }

      .cs-db-tl {
        top: 18px;
        left: 18px;
        border-width: 2px 0 0 2px;
      }

      .cs-db-tr {
        top: 18px;
        right: 18px;
        border-width: 2px 2px 0 0;
      }

      .cs-db-bl {
        bottom: 18px;
        left: 18px;
        border-width: 0 0 2px 2px;
      }

      .cs-db-br {
        bottom: 18px;
        right: 18px;
        border-width: 0 2px 2px 0;
      }

      .cs-drone-badge {
        position: absolute;
        top: 66px;
        left: 20px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        color: var(--cyan);
      }

      .cs-drone-compass {
        position: absolute;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 13px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      /* ── Modals (Sleek Visual Mutation Draft & Match Over) ────────────── */
      .cs-modal-backdrop {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(6, 14, 26, 0.52);
        pointer-events: auto;
        z-index: 30;
      }

      .cs-modal-card {
        width: min(680px, 100%);
        border-radius: 24px;
        padding: 22px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: var(--glass-bg-strong);
      }

      .cs-modal-sm {
        width: min(380px, 100%);
        text-align: center;
      }

      .cs-kicker {
        font-size: 10.5px;
        font-weight: 900;
        letter-spacing: 0.14em;
        color: var(--cyan);
      }

      .cs-modal-card h2 {
        margin: -6px 0 0;
        font-size: 22px;
        font-weight: 900;
      }

      .cs-draft-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .cs-draft-card {
        text-align: left;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 18px;
        padding: 15px;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 10px;
        cursor: pointer;
        transition: transform 0.13s ease, border-color 0.13s ease, background 0.13s ease;
      }

      .cs-draft-card:hover {
        transform: translateY(-4px);
        border-color: var(--cyan);
        background: rgba(77, 244, 255, 0.15);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
      }

      .cs-draft-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .cs-draft-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: rgba(77, 244, 255, 0.16);
        color: var(--cyan);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .cs-draft-slot {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.1em;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-dim);
      }

      .cs-draft-card h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 900;
      }

      .cs-stat-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        flex: 1;
        align-content: flex-start;
      }

      .cs-stat-chip {
        font-size: 11px;
        font-weight: 800;
        padding: 4px 8px;
        border-radius: 8px;
        background: rgba(52, 211, 153, 0.2);
        color: #a7f3d0;
      }

      .cs-stat-chip-alt {
        background: rgba(77, 244, 255, 0.16);
        color: #cffafe;
      }

      .cs-swap-warning {
        font-size: 11px;
        font-weight: 800;
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(251, 191, 36, 0.2);
        color: #fde68a;
      }

      .cs-new-slot {
        font-size: 11px;
        font-weight: 800;
        color: var(--emerald);
      }

      .cs-draft-footer {
        display: flex;
        justify-content: center;
      }

      .cs-winner-title {
        font-size: 28px !important;
        color: #fef08a;
      }

      .cs-scoreboard {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .cs-scoreboard th,
      .cs-scoreboard td {
        padding: 8px 10px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .cs-scoreboard th {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
      }

      .cs-scoreboard td .cs-dot {
        margin-right: 7px;
      }

      .cs-row-local {
        background: rgba(77, 244, 255, 0.1);
      }

      .cs-essence-summary {
        background: rgba(8, 17, 30, 0.56);
        border: 1px solid rgba(77, 244, 255, 0.28);
        border-radius: 14px;
        padding: 10px 14px;
      }

      .cs-essence-total {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: #fef08a;
      }

      .cs-modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      /* ── Toast Banner ─────────────────────────────────────────────────── */
      .cs-toast {
        position: fixed;
        top: 84px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 800;
        background: rgba(11, 22, 38, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.36);
        z-index: 40;
      }

      .cs-toast-success {
        border-color: rgba(52, 211, 153, 0.72);
        color: #a7f3d0;
      }

      .cs-toast-error {
        border-color: rgba(251, 113, 133, 0.82);
        color: #fecdd3;
      }

      /* ── 3D-Projected Floating Damage & Tactical Event Popups ────────── */
      .cs-popup-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 32;
      }

      .cs-float-popup {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.03em;
        white-space: nowrap;
        text-shadow: 0 3px 10px rgba(4, 10, 22, 0.92),
          0 0 2px rgba(4, 10, 22, 0.98);
        animation: csFloatRise 1.22s cubic-bezier(0.18, 0.88, 0.28, 1) forwards;
        will-change: transform, opacity;
      }

      .cs-float-damage {
        color: #ff6b81;
      }

      .cs-float-heal {
        color: #34d399;
        font-size: 24px;
      }

      .cs-float-shield {
        color: #4df4ff;
      }

      .cs-float-event {
        color: #fde047;
        font-size: 20px;
      }

      @keyframes csFloatRise {
        0% {
          opacity: 0;
          transform: translate(-50%, -18%) scale(0.76);
        }
        16% {
          opacity: 1;
          transform: translate(-50%, -68%) scale(1.12);
        }
        75% {
          opacity: 1;
          transform: translate(-50%, -128%) scale(1.0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -165%) scale(0.92);
        }
      }

      /* ── Real 3D Portraits, Big Power Bar, HOLD TO FIRE & ? Quick Controls ── */
      .cs-sp-portrait {
        width: 58px;
        height: 58px;
        border-radius: 14px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 12px rgba(4, 10, 22, 0.45),
          0 0 12px color-mix(in srgb, var(--sp-accent, #4df4ff) 28%, transparent);
        background: rgba(8, 18, 34, 0.72);
        flex-shrink: 0;
        transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
      }

      .cs-sp-portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .cs-sp-tile:hover:not(.cs-locked) .cs-sp-portrait {
        transform: scale(1.04);
      }

      .cs-sp-tile.cs-selected .cs-sp-portrait {
        border-color: var(--sp-accent, var(--cyan));
        box-shadow: 0 0 0 1.5px var(--sp-accent, var(--cyan)),
          0 0 16px color-mix(in srgb, var(--sp-accent, #4df4ff) 55%, transparent);
      }

      .cs-sp-tile.cs-locked .cs-sp-portrait img {
        filter: grayscale(0.65) brightness(0.75);
      }

      .cs-roster-avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--cyan);
        flex-shrink: 0;
        background: rgba(8, 18, 34, 0.8);
      }

      .cs-hero-stage-badge {
        flex-direction: row;
        align-items: center;
        gap: 10px;
      }

      .cs-hero-stage-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--cyan);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        flex-shrink: 0;
      }

      .cs-hero-stage-copy {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }

      .cs-banner-inner {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .cs-banner-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        object-fit: cover;
        border: 2.5px solid rgba(77, 244, 255, 0.85);
        box-shadow: 0 0 18px rgba(77, 244, 255, 0.42);
        flex-shrink: 0;
      }

      .cs-banner-copy {
        text-align: left;
      }

      .cs-hud-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        border: 2.5px solid var(--cyan);
        box-shadow: 0 0 12px rgba(77, 244, 255, 0.34);
        flex-shrink: 0;
        background: rgba(8, 18, 34, 0.8);
      }

      .cs-score-player {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

        align-items: center;

        font-weight: 900;
        letter-spacing: 0.06em;

        height: 62px;
        min-width: 146px;
        padding: 0 18px;
        border-radius: 18px;
        border: 1.5px solid rgba(167, 243, 208, 0.78);
        background: linear-gradient(135deg, #10b981 0%, #0ea5e9 100%);
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.06em;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(14, 165, 233, 0.42),

        background: linear-gradient(135deg, #f59e0b 0%, #f43f5e 100%);

      }

      /* ── Round Clock, Flood Badge, Music Button & Deluge Alert ───────── */
      .cs-phase-badge[data-tone="flood"] {
        background: rgba(244, 63, 94, 0.42);
        border: 1px solid rgba(251, 113, 133, 0.78);
        color: #ffe4e6;
        box-shadow: 0 0 14px rgba(244, 63, 94, 0.45);
        animation: csPulseUrgent 1s ease-in-out infinite;
      }

      .cs-round-timer {
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 11px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        color: #e0f2fe;
      }

      .cs-round-timer.cs-rt-warn {
        background: rgba(251, 191, 36, 0.24);
        border-color: rgba(251, 191, 36, 0.72);
        color: #fef3c7;
        animation: csPulseWarn 1.3s ease-in-out infinite;
      }

      .cs-round-timer.cs-rt-urgent,
      .cs-round-timer.cs-rt-flood {
        background: rgba(244, 63, 94, 0.34);
        border-color: rgba(251, 113, 133, 0.85);
        color: #ffe4e6;
        box-shadow: 0 0 14px rgba(244, 63, 94, 0.45);
        animation: csPulseUrgent 0.85s ease-in-out infinite;
      }

      @keyframes csPulseWarn {
        0%, 100% {
          box-shadow: 0 0 0 rgba(251, 191, 36, 0);
        }
        50% {
          box-shadow: 0 0 14px rgba(251, 191, 36, 0.55);
        }
      }

      @keyframes csPulseUrgent {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      .cs-music-btn {
        font-size: 16px;
        font-weight: 900;
        position: relative;
      }

      .cs-music-btn[data-muted="1"] {
        color: var(--coral);
        opacity: 0.82;
      }

      .cs-music-btn[data-muted="1"]::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 2px;
        background: var(--coral);
        transform: rotate(-38deg);
        border-radius: 2px;
      }

      .cs-flood-alert {
        position: fixed;
        top: 72px;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 22px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          rgba(190, 18, 60, 0.86) 0%,
          rgba(234, 88, 12, 0.86) 50%,
          rgba(190, 18, 60, 0.86) 100%
        );
        border: 1.5px solid rgba(254, 205, 211, 0.85);
        box-shadow: 0 0 32px rgba(244, 63, 94, 0.58),
          0 10px 28px rgba(4, 12, 24, 0.48);
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        pointer-events: none;
        z-index: 26;
        animation: csFloodPulse 1.1s ease-in-out infinite;
      }

      @keyframes csFloodPulse {
        0%, 100% {
          transform: translateX(-50%) scale(1);
          box-shadow: 0 0 26px rgba(244, 63, 94, 0.5);
        }
        50% {
          transform: translateX(-50%) scale(1.03);
          box-shadow: 0 0 42px rgba(251, 113, 133, 0.82);
        }
      }

      }

        pointer-events: auto;
        z-index: 18;
        transition: opacity 0.16s ease, transform 0.16s ease;
      }

      .cs-standings-panel.cs-standings-obscured {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
      }

      .cs-standings-panel.cs-standings-collapsed {
        gap: 0;
        padding-bottom: 8px;
      }

      .cs-standings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        cursor: pointer;
        user-select: none;
      }

      .cs-standings-title {
        font-size: 10.5px;
        font-weight: 900;
        letter-spacing: 0.08em;
        color: var(--cyan);
        white-space: nowrap;
      }

      .cs-standings-toggle {
        border: none;
        background: transparent;
        color: var(--text-dim);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 800;
        padding: 0;
        cursor: pointer;
      }

      .cs-standings-toggle kbd {
        font-size: 9px;
        padding: 1px 4px;
      }

      .cs-standings-body {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .cs-standings-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 7px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 11px;
      }

      .cs-standings-row.cs-st-active {
        background: rgba(77, 244, 255, 0.16);
        border-color: rgba(77, 244, 255, 0.56);
        box-shadow: 0 0 12px rgba(77, 244, 255, 0.18);
      }

      .cs-standings-row.cs-st-local:not(.cs-st-active) {
        border-color: rgba(52, 211, 153, 0.36);
      }

      .cs-standings-row.cs-st-ko {
        opacity: 0.54;
      }

      .cs-st-pip {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
      }

      .cs-st-main {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1;
        min-width: 0;
      }

      .cs-st-name-line {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }

      .cs-st-name {
        font-weight: 800;
        color: #ffffff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cs-st-you {
        font-size: 8.5px;
        font-weight: 900;
        padding: 1px 4px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.28);
        color: #a7f3d0;
        flex-shrink: 0;
      }

      .cs-st-team {
        font-size: 8.5px;
        font-weight: 900;
        padding: 1px 4px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.24);
        color: #bae6fd;
        flex-shrink: 0;
      }

      .cs-standings-hp {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
        display: flex;
        align-items: center;
      }

      .cs-standings-hp-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--emerald);
        transition: width 0.18s ease;
      }

      .cs-standings-hp-fill[data-tier="mid"] {
        background: var(--amber);
      }

      .cs-standings-hp-fill[data-tier="low"] {
        background: var(--coral);
      }

      .cs-st-ko-tag {
        font-size: 8.5px;
        font-weight: 900;
        letter-spacing: 0.08em;
        color: var(--coral);
        line-height: 1;
      }

      .cs-standings-row.cs-st-ko .cs-standings-hp {
        height: auto;
        background: transparent;
      }

      .cs-st-kills {
        font-size: 10px;
        font-weight: 800;
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }

      .cs-st-score {
        font-size: 12px;
        font-weight: 900;
        color: #fde68a;
        min-width: 24px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }

      @media (max-width: 900px) {
        .cs-standings-panel {
          width: 196px;
          top: 62px;
          right: 10px;
        }
        .cs-cam-pill span,
        .cs-cam-pill kbd {
          display: none;
        }
        .cs-quickstart-pill {
          display: none;
        }
        .cs-hero-stage-badge {
          display: none;
        }
        .cs-hold-fire-btn {
          min-width: 112px;
          padding: 0 12px;
          font-size: 11.5px;
        }
        .cs-armory-pill-btn {
          padding: 0 10px;
          font-size: 11px;
        }
        .cs-loadout-drawer {
          width: min(340px, calc(100vw - 44px));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
